name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并发布签名 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # flutter_soloud 走 Dart native assets 构建钩子，flutter test 会为宿主
      # 平台编译 SoLoud 的 C++ 源码，其 ALSA 后端需要 alsa/asoundlib.h。
      - name: 安装 ALSA 开发库
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze --fatal-infos

      - name: 运行测试
        run: flutter test

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，将回退到 debug 签名构建" >&2
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: 构建按 ABI 拆分的 APK
        run: flutter build apk --release --split-per-abi

      - name: 构建通用 APK
        run: flutter build apk --release

      - name: 清理密钥
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.p12"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
